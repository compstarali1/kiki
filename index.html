<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Kiki</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            width: 100%;
            height: 100vh;
        }

        /* 🖼️ Background — kiki.jpg at 50% opacity over black */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('kiki.jpg') center center / cover no-repeat;
            opacity: 0.5;
            z-index: 1;
        }

        /* ✅ BUTTON — 50% TRANSPARENT — 25% UP FROM BOTTOM — CENTERED HORIZONTALLY */
        .play-btn {
            position: fixed;
            bottom: 25%; /* ✅ 25% from bottom of screen */
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999; /* ✅ Always on top */

            /* 📏 Large responsive size */
            min-width: 300px;
            width: 42vw;
            max-width: 500px;
            min-height: 130px;
            height: 16vh;
            max-height: 180px;

            font-size: clamp(26px, 4.5vw, 44px);
            font-weight: 900;
            color: #ffffff;
            text-align: center;

            /* 🎨 50% TRANSPARENT — deep colours shine through */
            background: linear-gradient(145deg, rgba(255,77,166,0.5), rgba(153,0,68,0.5));
            border: 6px solid rgba(255,255,255,0.6);
            border-radius: 28px;
            opacity: 0.5; /* ✅ EXACTLY 50% TRANSPARENT */

            /* 🔥 DEEP 3D SHADOWS — still visible through transparency */
            box-shadow: 
                0 20px 0 rgba(107,0,46,0.4),
                0 30px 50px rgba(0,0,0,0.35),
                inset 0 4px 0 rgba(255,255,255,0.25);

            cursor: pointer;
            transition: all 0.15s ease;
            text-shadow: 0 3px 6px rgba(0,0,0,0.4);
            letter-spacing: 2px;
            padding: 10px 20px;
        }

        /* ✨ HOVER — becomes clearer, rises slightly */
        .play-btn:hover {
            opacity: 0.75;
            transform: translateX(-50%) translateY(-8px);
            box-shadow: 
                0 28px 0 rgba(107,0,46,0.45),
                0 40px 60px rgba(0,0,0,0.4),
                inset 0 5px 0 rgba(255,255,255,0.35);
        }

        /* 👇 CLICK — sinks down */
        .play-btn:active {
            opacity: 0.6;
            transform: translateX(-50%) translateY(10px);
            box-shadow: 
                0 10px 0 rgba(107,0,46,0.35),
                0 15px 25px rgba(0,0,0,0.25),
                inset 0 2px 0 rgba(255,255,255,0.2);
        }

        audio { display: none; }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <!-- ✅ 50% TRANSPARENT BUTTON — 25% FROM BOTTOM -->
    <button class="play-btn" onclick="document.getElementById('audio').play()">
        💖 PLAY FOR MY KIKI 💖
    </button>

    <audio id="audio" src="kiki.mp3" preload="auto">

</body>
</html>
